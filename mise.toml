[tools]
erlang = "28"
elixir = "1.19"
node = "22"

[tasks.setup]
description = "Install deps, start db, setup schema"
depends = ["db:start"]
run = "mix deps.get && mix ecto.setup"

[tasks.dev]
description = "Start Phoenix server"
depends = ["db:migrate"]
run = "mix phx.server"

[tasks.iex]
description = "Start Phoenix server with IEx"
depends = ["db:migrate"]
run = "iex -S mix phx.server"

[tasks.test]
description = "Run tests"
depends = ["db:start"]
run = "mix test"

[tasks.format]
description = "Format code"
run = "mix format"

[tasks.deps]
description = "Fetch deps"
run = "mix deps.get"

[tasks.db]
alias = "db:start"

[tasks."db:start"]
description = "Start PostgreSQL container"
run = """
docker run -d --name mast-postgres \
  -e POSTGRES_USER=mast \
  -e POSTGRES_PASSWORD=mast \
  -e POSTGRES_DB=mast_dev \
  -p 7544:5432 \
  postgres:18-alpine 2>/dev/null || docker start mast-postgres
"""

[tasks."db:stop"]
description = "Stop PostgreSQL container"
run = "docker stop mast-postgres"

[tasks."db:migrate"]
description = "Run pending migrations"
depends = ["db:start"]
run = "mix ecto.migrate"

[tasks."db:reset"]
description = "Drop, create, migrate, seed"
depends = ["db:start"]
run = "mix ecto.reset"

# ---- Production release ----
#
# `mise run release` builds a self-contained release at
# _build/prod/rel/mast. Run on the target host (or matching arch).
#
# Then on the host:
#   _build/prod/rel/mast/bin/mast eval 'Mast.Release.migrate()'
#   _build/prod/rel/mast/bin/mast start

[tasks."release:deps"]
description = "Fetch prod-only deps"
env = { MIX_ENV = "prod" }
run = "mix deps.get --only prod"

[tasks."release:compile"]
description = "Compile in prod env"
depends = ["release:deps"]
env = { MIX_ENV = "prod" }
run = "mix compile"

[tasks."release:npm"]
description = "Install JS deps for esbuild (chart.js etc.)"
run = "cd assets && npm ci --omit=dev"

[tasks."release:assets"]
description = "Build and digest assets"
depends = ["release:compile", "release:npm"]
env = { MIX_ENV = "prod" }
run = "mix assets.setup && mix assets.deploy"

[tasks.release]
description = "Build a production release"
depends = ["release:assets"]
env = { MIX_ENV = "prod" }
run = "mix release --overwrite"

[tasks."release:migrate"]
description = "Run migrations against the built release (requires env vars)"
env = { MIX_ENV = "prod" }
run = "_build/prod/rel/mast/bin/mast eval 'Mast.Release.migrate()'"
